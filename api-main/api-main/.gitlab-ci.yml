stages:
  - staging

Build On Staging:
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
  tags:
    -  affiliate
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export ASP_ENV="$ASP_ENV_STAGE"
    - export ADMIN_PASSWORD="$ADMIN_PASSWORD_STAGE"
    - docker network create qalaat_net || true
    - docker compose build
    - docker compose down
    - docker compose up -d

Build On Production manategh mahroom:
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  tags:
    -  affiliate
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export ASP_ENV="$ASP_ENV_PROD"
    - export ADMIN_PASSWORD="$ADMIN_PASSWORD_PRODUCTION"
    - docker login -u "$dehghanian_user" -p "$dehghanian_pass" git.faramaham.com:5050
    - docker build -t git.faramaham.com:5050/asp/qalaatal-dhaman/backend/api:prod .
    - docker push git.faramaham.com:5050/asp/qalaatal-dhaman/backend/api:prod

Build On Production:
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main2"
      when: always
  tags:
    -  qalaat-prod
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export ASP_ENV="$ASP_ENV_PROD"
    - export ADMIN_PASSWORD="$ADMIN_PASSWORD_PRODUCTION"
    - docker network create qalaat_net || true
    - docker compose build
    - docker compose down
    - docker compose up -d