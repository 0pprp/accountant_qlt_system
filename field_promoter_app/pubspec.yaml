name: field_promoter_app
description: تطبيق المروّج الميداني — قلعة الضمان.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.6
  geolocator: ^14.0.1
  flutter_svg: ^2.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  qalaat_in_app_update:
    path: ../packages/qalaat_in_app_update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ElMessiri-Bold.ttf
          weight: 700
