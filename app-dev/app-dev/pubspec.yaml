name: team
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.4+19

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.3.0
  firebase_core: ^3.12.1
  flutter_svg: ^2.0.17
  flutter_bloc: ^9.1.0
  intl: ^0.20.2
  fluttertoast: ^9.1.0
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  firebase_crashlytics: ^4.3.5
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  get_it: ^8.0.3
  sprung: ^3.0.1
  dio: ^5.8.0+1
  curved_navigation_bar: ^1.0.6
  lottie: ^3.3.1
  calendar_date_picker2: ^2.0.1
  vector_graphics: ^1.1.18
  open_file: ^3.5.10
  permission_handler: ^12.0.0+1
  firebase_analytics: ^11.4.6
  package_info_plus: ^8.0.1
  pdf: ^3.11.3
  dotted_border: ^3.1.0
  image_picker: ^1.2.2
  carousel_slider: ^5.1.2
  flutter_image_compress: ^2.3.0



dev_dependencies:
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  vector_graphics_compiler: ^1.1.17


  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler

  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ElMessiri-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400